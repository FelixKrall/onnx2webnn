[package]
name = "onnx2webnn"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "ONNX to WebNN graph conversion (uses rustnn shape inference)"

[lib]
name = "onnx2webnn"
path = "src/lib.rs"

[[bin]]
name = "onnx2webnn"
path = "src/main.rs"
required-features = ["env_logging"]

[features]
# Enable logging by default in main binary
default = ["env_logging"]
# Make rustnn's CoreML backend available for --backend coreml (macOS only).
coreml = ["rustnn/coreml-runtime"]
# Make rustnn's TensorRT-RTX backend available for --backend trtx (NVIDIA GPU).
trtx = ["rustnn/trtx-runtime"]
# Allow execution backends to build graphs with dynamic dimensions.
dynamic-inputs = ["rustnn/dynamic-inputs"]
# Enable logging on RUST_LOG (could be replaced by tracing-subscriber) 
env_logging = ["dep:pretty_env_logger"]

[dependencies]
anyhow = "1.0"
log = "0.4"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
half = "2.7.1"
prost = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
ureq = { version = "2.10", default-features = false, features = ["tls"] }
sha2 = "0.10"
safetensors = "0.7"

rustnn = { git = "https://github.com/rustnn/rustnn", branch = "main", default-features = false, features = ["onnx-runtime"] }
bytemuck = "1.15"
webnn-onnx-utils = { git = "https://github.com/rustnn/webnn-onnx-utils", branch = "main" }
huggingface-hub = { git = "https://github.com/huggingface/huggingface_hub_rust.git", rev = "20acfd61a767dcf7d6a0cb7f4a02ac8406fd8a14", version = "0.0.1", features = ["blocking", "xet"] }
pretty_env_logger = { version = "0.5", optional = true }

[dev-dependencies]
tempfile = "3.8"
pretty_env_logger = "0.5"

[patch.crates-io]
webnn-onnx-utils = { git = "https://github.com/rustnn/webnn-onnx-utils", branch = "main" }
