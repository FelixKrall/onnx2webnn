name: CI

on:
  push:
    branches: [main, transformers]
  pull_request:
    branches: [main, transformers]

env:
  # Keep in sync with the `ort` crate version pinned by rustnn.
  ORT_VERSION: 1.29.0
  # rustnn checkout. Pinned to the fork branch carrying the ONNX exporter
  # fixes (Squeeze axes, f16 casts, bidirectional LSTM/GRU) until they land
  # upstream; then switch back to rustnn/rustnn @ main.
  RUSTNN_REPO: mklimenko-nv/rustnn
  RUSTNN_REF: private/mklimenko/onnx2webnn-fixes

jobs:
  test:
    name: Build & Test (${{ matrix.os }}${{ matrix.cargo_flags && ', coreml' || '' }})
    runs-on: ${{ matrix.os }}
    # The CoreML job dispatches every integration test through Apple's CoreML
    # backend; op coverage there may lag the ORT backend, so it reports
    # without blocking until it has a green track record.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            ort_archive: onnxruntime-linux-x64
            ort_ext: tgz
            ort_dylib: lib/libonnxruntime.so
          - os: windows-latest
            ort_archive: onnxruntime-win-x64
            ort_ext: zip
            ort_dylib: lib/onnxruntime.dll
          - os: macos-latest
            ort_archive: onnxruntime-osx-arm64
            ort_ext: tgz
            ort_dylib: lib/libonnxruntime.dylib
            # rustnn selects the CoreML backend automatically on macOS when
            # the feature is compiled in (ORT still serves as the reference).
            cargo_flags: --features coreml
            experimental: true
    defaults:
      run:
        shell: bash
        working-directory: onnx2webnn
    steps:
      # rustnn contains paths longer than Windows' 260-char MAX_PATH.
      - name: Enable git long paths (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        run: git config --system core.longpaths true

      - name: Checkout onnx2webnn
        uses: actions/checkout@v4
        with:
          path: onnx2webnn

      # Cargo.toml references rustnn as a sibling path dependency (../rustnn).
      - name: Checkout rustnn
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RUSTNN_REPO }}
          ref: ${{ env.RUSTNN_REF }}
          path: rustnn

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # rustnn's build.rs compiles CoreML protos with prost-build, which needs protoc.
      - name: Install protobuf compiler
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            onnx2webnn/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('onnx2webnn/Cargo.lock') }}

      - name: Download ONNX Runtime ${{ env.ORT_VERSION }}
        run: |
          archive="${{ matrix.ort_archive }}-${ORT_VERSION}"
          url="https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${archive}.${{ matrix.ort_ext }}"
          mkdir -p "$RUNNER_TEMP/ort"
          curl -sSL "$url" -o "$RUNNER_TEMP/ort/archive.${{ matrix.ort_ext }}"
          if [ "${{ matrix.ort_ext }}" = "zip" ]; then
            unzip -q "$RUNNER_TEMP/ort/archive.zip" -d "$RUNNER_TEMP/ort"
          else
            tar -xzf "$RUNNER_TEMP/ort/archive.tgz" -C "$RUNNER_TEMP/ort"
          fi
          dylib="$RUNNER_TEMP/ort/${archive}/${{ matrix.ort_dylib }}"
          # Linux/macOS release tarballs may ship only a versioned library.
          if [ ! -f "$dylib" ]; then
            dylib="$(ls "$RUNNER_TEMP/ort/${archive}"/lib/libonnxruntime.*.dylib \
                       "$RUNNER_TEMP/ort/${archive}"/lib/libonnxruntime.so.* 2>/dev/null | head -1)"
          fi
          echo "ORT_DYLIB_PATH=$dylib" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build (release)
        run: cargo build --release --locked ${{ matrix.cargo_flags }}

      - name: Test (release)
        run: cargo test --release --locked ${{ matrix.cargo_flags }}
