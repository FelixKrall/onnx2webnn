name: RustNN main compatibility

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Compile against RustNN main (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cargo_flags: ''
          - os: macos-latest
            cargo_flags: --features coreml
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update to live RustNN main
        run: cargo update -p rustnn
      - name: Check all targets
        id: check
        run: cargo check --locked --all-targets ${{ matrix.cargo_flags }}
      - name: Report compatibility
        if: always()
        run: |
          echo 'RustNN main compatibility: ${{ steps.check.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          if [ '${{ steps.check.outcome }}' != 'success' ]; then
            echo '::warning::RustNN main compatibility check did not pass; normal CI uses the tested revision.'
          fi
